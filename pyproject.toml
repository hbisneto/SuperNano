[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supernanno"
version = "0.1.23"
description = "Nano, but modern. A powerful terminal text editor built with Textual and Tree-sitter."
readme = "README.md"

license = { text = "BSD-3-Clause" }
authors = [
    { name = "Heitor Bardemaker A. Bisneto", email = "bisnetoinc@gmail.com" }
]
keywords = ["text-editor", "terminal", "tui", "editor", "nano"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
]
requires-python = ">=3.10"

dependencies = [
    "anyio==4.12.1",
    "build==1.5.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.7",
    "exceptiongroup==1.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "importlib_metadata==9.0.0",
    "iniconfig==2.3.0",
    "linkify-it-py==2.1.0",
    "markdown-it-py==4.0.0",
    "mdit-py-plugins==0.5.0",
    "mdurl==0.1.2",
    "nannokit-dialogs==0.1.32",
    "packaging==26.2",
    "pillow==12.2.0",
    "platformdirs==4.9.4",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pyproject_hooks==1.2.0",
    "pytest==9.0.3",
    "reportlab==4.5.1",
    "rich==14.3.3",
    "textual==8.2.8",
    "tomli==2.4.1",
    "tree-sitter==0.25.2",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-html==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-regex==0.25.0",
    "tree-sitter-rust==0.24.0",
    "tree-sitter-sql==0.3.11",
    "tree-sitter-toml==0.7.0",
    "tree-sitter-xml==0.7.0",
    "tree-sitter-yaml==0.7.2",
    "typing_extensions==4.15.0",
    "uc-micro-py==2.0.0",
    "zipp==4.1.0",
]

[project.scripts]
supernanno = "app:main"

[project.urls]
Homepage = "https://github.com/hbisneto/SuperNanno"
Repository = "https://github.com/hbisneto/SuperNanno"
"Bug Tracker" = "https://github.com/hbisneto/SuperNanno/issues"

[tool.setuptools]
packages = { find = { where = ["."], exclude = ["tests*", "frontend*", "*.egg-info", "build", "dist"] } }
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.md", "*.css", "style.tcss"]