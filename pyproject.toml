[project]
name = "supernanno"
version = "0.0.23"
description = "Nano, but modern. A powerful terminal text editor built with Textual and Tree-sitter."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Heitor Bardemaker A. Bisneto", email = "bisnetoinc@gmail.com" }
]
keywords = ["text-editor", "terminal", "tui", "editor", "nano"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
]

requires-python = ">=3.12"
dependencies = [
    "textual==8.2.3",
    "rich==14.3.3",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-rust==0.24.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-yaml==0.7.2",
    "tree-sitter-toml==0.7.0",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-html==0.23.2",
    "tree-sitter-css==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-sql==0.3.11",
    "tree-sitter-xml==0.7.0",
    "tree-sitter-regex==0.25.0",
    "Pygments==2.19.2",
    "httpx==0.28.1",
    "platformdirs==4.9.4",
    "markdown-it-py==4.0.0",
    "anyio==4.12.1",
    "linkify-it-py==2.1.0",
]

[project.scripts]
supernanno = "app:main"

[project.urls]
Homepage = "https://github.com/hbisneto/SuperNanno"
Repository = "https://github.com/hbisneto/SuperNanno"
"Bug Tracker" = "https://github.com/hbisneto/SuperNanno/issues"

[tool.setuptools]
packages = { find = { where = ["."], exclude = ["tests*", "frontend*"] } }

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.md", "style.tcss"]